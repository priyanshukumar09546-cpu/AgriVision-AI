<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 38" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="leafInner" x1="20%" y1="80%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#15803D" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Main Leaf Body -->
  <path d="M8 32 C 8 32, 5 24, 11 16 C 16 9, 26 5, 38 4 C 40 4, 40 6, 38 8 C 31 16, 27 24, 18 29 C 14 31.5, 10 32, 8 32 Z" 
        fill="url(#leafGrad)" 
        filter="url(#subtleGlow)" />
        
  <!-- Inner Highlight Curve -->
  <path d="M11 29 C 9 25, 13 18, 19 12 C 25 7, 34 5, 36 5 C 32 11, 26 18, 19 24 C 15 27, 12 28.5, 11 29 Z" 
        fill="url(#leafInner)" 
        opacity="0.85" />
        
  <!-- Central Vein -->
  <path d="M8 32 C 14 26, 23 18, 38 4" 
        stroke="#FFFFFF" 
        stroke-width="1.4" 
        stroke-linecap="round" 
        stroke-opacity="0.75" />
        
  <!-- Secondary Vein Branches -->
  <path d="M17 23 C 21 21, 25 21, 28 23" 
        stroke="#FFFFFF" 
        stroke-width="0.9" 
        stroke-linecap="round" 
        stroke-opacity="0.5" />
  <path d="M23 18 C 26 15, 30 15, 33 16" 
        stroke="#FFFFFF" 
        stroke-width="0.9" 
        stroke-linecap="round" 
        stroke-opacity="0.5" />
  <path d="M14 27 C 12 24, 12 22, 13 20" 
        stroke="#FFFFFF" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        stroke-opacity="0.45" />
        
  <!-- Leaf Stem -->
  <path d="M8 32 C 6 34, 4 36, 3 37" 
        stroke="#15803D" 
        stroke-width="2.2" 
        stroke-linecap="round" />
</svg>
